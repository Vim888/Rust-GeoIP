[package]
name = "rust-geoip"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
description = "Local IPv4 and IPv6 lookups over a Unix socket using GeoIP Legacy databases"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "=1.48.0", features = ["rt", "net", "io-util", "time"] }

[profile.release]
strip = true

[build-dependencies]
cc = "1"
